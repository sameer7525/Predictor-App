<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Color-Trading App</title>
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <div class="app">
    <h1>Hack</h1>
    <h1>Wingo 1 min</h1>

    <div class="period-box">
      <span class="label">Period</span>
      <span id="period" class="period">--</span>
    </div>

    <div class="timer-box">
      <span class="label">Time remaning</span>
      <div id="timer" class="timer">60</div>s
    </div>

    <div class="result-box">
      <span class="label">Last Result</span>
      <div id="resultPeriod" class="result-period">--</div>
      <div id="result" class="result">--</div>
    </div>

    <button id="playBtn">Play</button>

    <div class="history-box">
      <h3>History</h3>
      <div id="history" class="history"></div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
